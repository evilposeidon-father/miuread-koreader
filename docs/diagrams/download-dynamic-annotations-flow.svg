<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" width="960" height="760">
    <style>
      text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Microsoft JhengHei', 'SimHei', sans-serif; }
      .title { font-size: 18px; font-weight: 600; fill: #111827; }
      .node { font-size: 13px; font-weight: 600; fill: #111827; }
      .sub  { font-size: 11px; fill: #6b7280; }
      .zone { font-size: 11px; fill: #6b7280; }
    </style>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/>
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/>
    </marker>
  </defs>
  <rect width="960" height="760" fill="#ffffff"/>
  <text x="40" y="38" class="title">MiuRead 下载与动态批注流程（4.6.2）</text>
  <rect x="60" y="80" width="200" height="72" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="160.0" y="112.5" text-anchor="middle" class="node">用户选择下载</text>
  <text x="160.0" y="128.5" text-anchor="middle" class="node">只生成一个版本</text>
  <rect x="360" y="80" width="200" height="72" rx="8" ry="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="460.0" y="112.5" text-anchor="middle" class="node">纯净版 EPUB</text>
  <text x="460.0" y="128.5" text-anchor="middle" class="node">正文完整，不内嵌划线</text>
  <line x1="260" y1="116" x2="360" y2="116" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <rect x="640" y="80" width="240" height="88" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="760.0" y="112.5" text-anchor="middle" class="node">打开书籍</text>
  <text x="760.0" y="128.5" text-anchor="middle" class="node">自动匹配 WeRead 书籍</text>
  <text x="760.0" y="144.5" text-anchor="middle" class="node">本地书也可匹配并上传</text>
  <line x1="560" y1="116" x2="640" y2="116" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <rect x="640" y="230" width="240" height="112" rx="8" ry="8" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="760.0" y="266.5" text-anchor="middle" class="node">动态拉取调度器</text>
  <text x="760.0" y="282.5" text-anchor="middle" class="node">在线 + 登录 + 空闲</text>
  <text x="760.0" y="298.5" text-anchor="middle" class="node">当前章 + 下一章渐进</text>
  <text x="760.0" y="314.5" text-anchor="middle" class="node">断点续传 / 可取消</text>
  <line x1="760" y1="168" x2="760" y2="230" stroke="#9333ea" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <rect x="360" y="230" width="220" height="112" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="470.0" y="274.5" text-anchor="middle" class="node">微信读书 API</text>
  <text x="470.0" y="290.5" text-anchor="middle" class="node">划线与想法按章返回</text>
  <text x="470.0" y="306.5" text-anchor="middle" class="node">个人 + 全量合并去重</text>
  <line x1="640" y1="286" x2="580" y2="286" stroke="#9333ea" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <rect x="60" y="230" width="220" height="112" rx="8" ry="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="170.0" y="274.5" text-anchor="middle" class="node">XPointer Overlay</text>
  <text x="170.0" y="290.5" text-anchor="middle" class="node">本地 EPUB 上绘制下划线</text>
  <text x="170.0" y="306.5" text-anchor="middle" class="node">位置缓存 + 分帧预热</text>
  <line x1="360" y1="286" x2="280" y2="286" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <rect x="360" y="400" width="220" height="72" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="470.0" y="432.5" text-anchor="middle" class="node">阅读快捷面板</text>
  <text x="470.0" y="448.5" text-anchor="middle" class="node">「显隐划线」开关</text>
  <line x1="470" y1="342" x2="470" y2="400" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <rect x="60" y="420" width="220" height="96" rx="8" ry="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="170.0" y="456.5" text-anchor="middle" class="node">失败与重试</text>
  <text x="170.0" y="472.5" text-anchor="middle" class="node">网络/登录恢复后自动重试</text>
  <text x="170.0" y="488.5" text-anchor="middle" class="node">登录续期预防性保活</text>
  <line x1="60" y1="342" x2="60" y2="420" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
  <line x1="60" y1="516" x2="280" y2="516" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <g transform="translate(40,690)">
    <line x1="0" y1="8" x2="26" y2="8" stroke="#2563eb" stroke-width="1.5"/>
    <text x="32" y="12" class="zone">下载 / 显示路径</text>
    <line x1="0" y1="30" x2="26" y2="30" stroke="#9333ea" stroke-width="1.5"/>
    <text x="32" y="34" class="zone">动态拉取</text>
    <line x1="0" y1="52" x2="26" y2="52" stroke="#ea580c" stroke-width="1.5"/>
    <text x="32" y="56" class="zone">失败重试</text>
    <line x1="0" y1="74" x2="26" y2="74" stroke="#6b7280" stroke-width="1.5"/>
    <text x="32" y="78" class="zone">旧版兼容</text>
  </g>
</svg>
