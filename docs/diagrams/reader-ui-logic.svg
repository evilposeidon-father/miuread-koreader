<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720">
    <style>
      text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Microsoft JhengHei', 'SimHei', sans-serif; }
      .title { font-size: 18px; font-weight: 600; fill: #111827; }
      .node { font-size: 13px; font-weight: 600; fill: #111827; }
      .sub  { font-size: 11px; fill: #6b7280; }
      .zone { font-size: 11px; fill: #6b7280; }
    </style>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/>
    </marker>
  </defs>
  <rect width="960" height="720" fill="#ffffff"/>
  <text x="40" y="38" class="title">MiuRead 阅读页操作逻辑（4.6.2）</text>
  <rect x="250" y="70" width="460" height="380" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="480" y="92" text-anchor="middle" class="node">正文阅读区（状态行含今日阅读时长）</text>
  <rect x="250" y="70" width="110" height="380" fill="#eff6ff" fill-opacity="0.5"/>
  <text x="305" y="260" text-anchor="middle" class="zone">左边缘
点按翻页</text>
  <rect x="600" y="70" width="110" height="380" fill="#eff6ff" fill-opacity="0.5"/>
  <text x="655" y="260" text-anchor="middle" class="zone">右边缘
点按翻页</text>
  <rect x="360" y="70" width="240" height="42" fill="#fef3c7" fill-opacity="0.65"/>
  <text x="480" y="96" text-anchor="middle" class="zone">顶部下滑 → 快捷面板</text>
  <rect x="40" y="500" width="880" height="64" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="480.0" y="528.5" text-anchor="middle" class="node">快捷面板（五组前置）</text>
  <text x="480.0" y="544.5" text-anchor="middle" class="node">更多 · 目录 · 进度 + 字体 · 亮度</text>
  <line x1="480" y1="450" x2="480" y2="500" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <rect x="40" y="140" width="170" height="96" rx="8" ry="8" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="125.0" y="176.5" text-anchor="middle" class="node">更多 → 控制中心</text>
  <text x="125.0" y="192.5" text-anchor="middle" class="node">书签 · 想法 · 划线 · 搜索 · 设置</text>
  <text x="125.0" y="208.5" text-anchor="middle" class="node">批注面板 / 本章想法 / 最近批注</text>
  <line x1="210" y1="188" x2="250" y2="188" stroke="#9333ea" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <rect x="40" y="270" width="170" height="96" rx="8" ry="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="125.0" y="306.5" text-anchor="middle" class="node">长按选词</text>
  <text x="125.0" y="322.5" text-anchor="middle" class="node">自动下划线（默认样式）</text>
  <text x="125.0" y="338.5" text-anchor="middle" class="node">选词菜单开关可留复制/查词</text>
  <line x1="210" y1="318" x2="250" y2="318" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <rect x="40" y="396" width="170" height="76" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="125.0" y="430.5" text-anchor="middle" class="node">点击已有划线</text>
  <text x="125.0" y="446.5" text-anchor="middle" class="node">笔记 / 样式 / 删除</text>
  <line x1="210" y1="434" x2="250" y2="434" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <rect x="720" y="150" width="190" height="76" rx="8" ry="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="815.0" y="184.5" text-anchor="middle" class="node">夜间模式</text>
  <text x="815.0" y="200.5" text-anchor="middle" class="node">KOReader 原生 night_mode</text>
  <rect x="720" y="250" width="190" height="76" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="815.0" y="284.5" text-anchor="middle" class="node">边缘防误触</text>
  <text x="815.0" y="300.5" text-anchor="middle" class="node">边缘点击可转翻页</text>
  <g transform="translate(40,640)">
    <line x1="0" y1="8" x2="26" y2="8" stroke="#2563eb" stroke-width="1.5"/>
    <text x="32" y="12" class="zone">点按 / 面板</text>
    <line x1="0" y1="30" x2="26" y2="30" stroke="#16a34a" stroke-width="1.5"/>
    <text x="32" y="34" class="zone">选词划线</text>
    <line x1="0" y1="52" x2="26" y2="52" stroke="#9333ea" stroke-width="1.5"/>
    <text x="32" y="56" class="zone">控制中心</text>
    <line x1="0" y1="74" x2="26" y2="74" stroke="#ea580c" stroke-width="1.5"/>
    <text x="32" y="78" class="zone">夜间 / 防误触</text>
  </g>
  <text x="40" y="620" class="sub">批注面板：书签/划线/想法计数 + 搜索全部批注；本章想法聚合章内划线与想法（点击跳转）。</text>
</svg>
