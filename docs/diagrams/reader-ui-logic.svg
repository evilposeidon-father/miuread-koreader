<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700">
    <style>
      text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Microsoft JhengHei', 'SimHei', sans-serif; }
      .title { font-size: 18px; font-weight: 600; fill: #111827; }
      .node { font-size: 13px; font-weight: 600; fill: #111827; }
      .sub  { font-size: 11px; fill: #6b7280; }
      .zone { font-size: 11px; fill: #6b7280; }
    </style>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9333ea"/>
    </marker>
  </defs>
  <rect width="960" height="700" fill="#ffffff"/>
  <text x="40" y="38" class="title">MiuRead 阅读页操作逻辑</text>
  <rect x="250" y="70" width="460" height="420" rx="10" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="480" y="92" text-anchor="middle" class="node">正文阅读区</text>
  <rect x="250" y="70" width="110" height="420" fill="#eff6ff" fill-opacity="0.5"/>
  <text x="305" y="280" text-anchor="middle" class="zone">左边缘
点按翻页</text>
  <rect x="600" y="70" width="110" height="420" fill="#eff6ff" fill-opacity="0.5"/>
  <text x="655" y="280" text-anchor="middle" class="zone">右边缘
点按翻页</text>
  <rect x="360" y="70" width="240" height="42" fill="#fef3c7" fill-opacity="0.65"/>
  <text x="480" y="96" text-anchor="middle" class="zone">顶部下滑 → 阅读快捷面板</text>
  <rect x="40" y="520" width="880" height="72" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="480.0" y="544.5" text-anchor="middle" class="node">阅读快捷面板</text>
  <text x="480.0" y="560.5" text-anchor="middle" class="node">搜索 · 回到阅读 · 云端划线</text>
  <text x="480.0" y="576.5" text-anchor="middle" class="node">本地上传 · 显隐划线 · 静默同步</text>
  <line x1="480" y1="490" x2="480" y2="520" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <rect x="40" y="140" width="160" height="76" rx="8" ry="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="120.0" y="166.5" text-anchor="middle" class="node">长按选词</text>
  <text x="120.0" y="182.5" text-anchor="middle" class="node">自动使用下划线</text>
  <text x="120.0" y="198.5" text-anchor="middle" class="node">不弹样式确认</text>
  <line x1="200" y1="178" x2="250" y2="178" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <rect x="40" y="250" width="160" height="76" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="120.0" y="284.5" text-anchor="middle" class="node">点击已有划线</text>
  <text x="120.0" y="300.5" text-anchor="middle" class="node">笔记 / 样式 / 颜色 / 删除</text>
  <line x1="200" y1="288" x2="250" y2="288" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <rect x="40" y="360" width="160" height="76" rx="8" ry="8" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text x="120.0" y="394.5" text-anchor="middle" class="node">点击云划线</text>
  <text x="120.0" y="410.5" text-anchor="middle" class="node">评论弹层 · 原文与想法</text>
  <line x1="200" y1="398" x2="250" y2="398" stroke="#9333ea" stroke-width="1.5" marker-end="url(#arrow-purple)"/>
  <rect x="720" y="150" width="190" height="88" rx="8" ry="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="815.0" y="182.5" text-anchor="middle" class="node">边缘防误触</text>
  <text x="815.0" y="198.5" text-anchor="middle" class="node">边缘点击可转翻页</text>
  <text x="815.0" y="214.5" text-anchor="middle" class="node">可关闭 / 调比例</text>
  <g transform="translate(40,624)">
    <line x1="0" y1="8" x2="26" y2="8" stroke="#2563eb" stroke-width="1.5"/>
    <text x="32" y="12" class="zone">点按 / 面板</text>
    <line x1="0" y1="30" x2="26" y2="30" stroke="#16a34a" stroke-width="1.5"/>
    <text x="32" y="34" class="zone">选词划线</text>
    <line x1="0" y1="52" x2="26" y2="52" stroke="#9333ea" stroke-width="1.5"/>
    <text x="32" y="56" class="zone">云划线评论</text>
    <line x1="0" y1="74" x2="26" y2="74" stroke="#ea580c" stroke-width="1.5"/>
    <text x="32" y="78" class="zone">边缘防误触</text>
  </g>
</svg>
