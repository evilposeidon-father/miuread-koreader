<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720">
    <style>
      text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Microsoft JhengHei', 'SimHei', sans-serif; }
      .title { font-size: 18px; font-weight: 600; fill: #111827; }
      .node { font-size: 13px; font-weight: 600; fill: #111827; }
      .sub  { font-size: 11px; fill: #6b7280; }
      .zone { font-size: 11px; fill: #6b7280; }
    </style>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/>
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="960" height="720" fill="#ffffff"/>
  <text x="40" y="38" class="title">MiuRead 划线交互流程</text>
  <rect x="330" y="84" width="300" height="64" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="480.0" y="120.5" text-anchor="middle" class="node">开始：长按 / 滑动选词</text>
  <line x1="480" y1="148" x2="480" y2="172" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <polygon points="480,175.0 555.0,212 480,249.0 405.0,212" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="480" y="216.5" text-anchor="middle" class="node">觅阅识别到的书籍？</text>
  <line x1="480" y1="252" x2="480" y2="276" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <line x1="555" y1="212" x2="700" y2="212" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow-gray)"/>
  <rect x="700" y="184" width="190" height="56" rx="8" ry="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="795.0" y="216.5" text-anchor="middle" class="node">KOReader 默认流程</text>
  <rect x="300" y="276" width="360" height="76" rx="8" ry="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="480.0" y="310.5" text-anchor="middle" class="node">自动应用默认样式「下划线」</text>
  <text x="480.0" y="326.5" text-anchor="middle" class="node">跳过样式选择，直接保存</text>
  <line x1="480" y1="352" x2="480" y2="376" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <rect x="300" y="376" width="360" height="76" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="480.0" y="410.5" text-anchor="middle" class="node">写入本机批注</text>
  <text x="480.0" y="426.5" text-anchor="middle" class="node">本地快照 → 约 12 秒后自动上传</text>
  <line x1="480" y1="452" x2="480" y2="476" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <polygon points="480,479.0 555.0,516 480,553.0 405.0,516" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="480" y="520.5" text-anchor="middle" class="node">点击这条划线？</text>
  <line x1="480" y1="556" x2="480" y2="580" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <rect x="260" y="580" width="440" height="80" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="480.0" y="616.5" text-anchor="middle" class="node">KOReader 原生二次操作</text>
  <text x="480.0" y="632.5" text-anchor="middle" class="node">添加笔记 / 修改样式 / 颜色 / 删除</text>
  <line x1="480" y1="660" x2="480" y2="680" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <rect x="330" y="680" width="300" height="64" rx="8" ry="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="480.0" y="708.5" text-anchor="middle" class="node">完成</text>
  <text x="480.0" y="724.5" text-anchor="middle" class="node">改动继续触发静默同步</text>
  <g transform="translate(40,650)">
    <line x1="0" y1="8" x2="26" y2="8" stroke="#2563eb" stroke-width="1.5"/>
    <text x="32" y="12" class="zone">主流程</text>
    <line x1="0" y1="30" x2="26" y2="30" stroke="#16a34a" stroke-width="1.5"/>
    <text x="32" y="34" class="zone">觅阅自动下划线</text>
    <line x1="0" y1="52" x2="26" y2="52" stroke="#ea580c" stroke-width="1.5"/>
    <text x="32" y="56" class="zone">长按 / 二次操作</text>
    <line x1="0" y1="74" x2="26" y2="74" stroke="#6b7280" stroke-width="1.5"/>
    <text x="32" y="78" class="zone">非觅阅书籍</text>
  </g>
</svg>
