  <line x1="406" y1="120" x2="406" y2="176" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="500" y1="120" x2="500" y2="176" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
  <line x1="250" y1="292" x2="472" y2="336" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="462" y1="336" x2="462" y2="384" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <g transform="translate(40,600)">
    <line x1="0" y1="8" x2="26" y2="8" stroke="#2563eb" stroke-width="1.5"/>
