  <rect x="760" y="336" width="132" height="48" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="826.0" y="364.5" text-anchor="middle" class="node">觅阅设置</text>
