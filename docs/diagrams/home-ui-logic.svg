<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720">
    <style>
      text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', 'Microsoft JhengHei', 'SimHei', sans-serif; }
      .title { font-size: 18px; font-weight: 600; fill: #111827; }
      .node { font-size: 13px; font-weight: 600; fill: #111827; }
      .sub  { font-size: 11px; fill: #6b7280; }
      .zone { font-size: 11px; fill: #6b7280; }
    </style>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/>
    </marker>
  </defs>
  <rect width="960" height="720" fill="#ffffff"/>
  <text x="40" y="38" class="title">MiuRead 首页操作逻辑（4.6.2：底部三 Tab）</text>
  <rect x="40" y="64" width="128" height="52" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="104.0" y="86.5" text-anchor="middle" class="node">账号</text>
  <text x="104.0" y="102.5" text-anchor="middle" class="node">登录状态</text>
  <rect x="180" y="64" width="116" height="52" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="238.0" y="86.5" text-anchor="middle" class="node">Wi-Fi</text>
  <text x="238.0" y="102.5" text-anchor="middle" class="node">点按开关</text>
  <rect x="308" y="64" width="200" height="52" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="408.0" y="78.5" text-anchor="middle" class="node">同步</text>
  <text x="408.0" y="94.5" text-anchor="middle" class="node">点按: 静默同步全部</text>
  <text x="408.0" y="110.5" text-anchor="middle" class="node">长按: 同步诊断</text>
  <rect x="520" y="64" width="84" height="52" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="562.0" y="94.5" text-anchor="middle" class="node">时间</text>
  <rect x="616" y="64" width="84" height="52" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="658.0" y="94.5" text-anchor="middle" class="node">电量</text>
  <rect x="712" y="64" width="84" height="52" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="754.0" y="94.5" text-anchor="middle" class="node">更多</text>
  <text x="40" y="148" class="node">顶部状态栏</text>
  <rect x="40" y="170" width="280" height="46" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="180.0" y="197.5" text-anchor="middle" class="node">书架</text>
  <rect x="340" y="170" width="280" height="46" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="480.0" y="197.5" text-anchor="middle" class="node">书城</text>
  <rect x="640" y="170" width="280" height="46" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="780.0" y="197.5" text-anchor="middle" class="node">我的</text>
  <text x="40" y="248" class="node">底部三 Tab（切页防抖，不弹页面名提示）</text>
  <rect x="40" y="268" width="280" height="76" rx="8" ry="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="180.0" y="302.5" text-anchor="middle" class="node">继续阅读大卡</text>
  <text x="180.0" y="318.5" text-anchor="middle" class="node">进度条 + 继续阅读</text>
  <rect x="40" y="364" width="280" height="76" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="180.0" y="398.5" text-anchor="middle" class="node">已下载</text>
  <text x="180.0" y="414.5" text-anchor="middle" class="node">书架排序: 最近/加入/书名/作者</text>
  <rect x="40" y="460" width="280" height="76" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="180.0" y="494.5" text-anchor="middle" class="node">本地书籍 / 公众号</text>
  <text x="180.0" y="510.5" text-anchor="middle" class="node">来源分组 · 长按管理</text>
  <text x="40" y="572" class="sub">书架页：继续阅读 + 分组书单 + 排序 + 空态「去书城逛逛吧」一键跳转。</text>
  <rect x="340" y="268" width="280" height="76" rx="8" ry="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="480.0" y="302.5" text-anchor="middle" class="node">搜索微信读书</text>
  <text x="480.0" y="318.5" text-anchor="middle" class="node">本地内容不伪装成书城</text>
  <rect x="340" y="364" width="280" height="76" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="480.0" y="398.5" text-anchor="middle" class="node">公众号</text>
  <text x="480.0" y="414.5" text-anchor="middle" class="node">订阅号文章阅读</text>
  <rect x="340" y="460" width="280" height="76" rx="8" ry="8" fill="#f9fafb" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="480.0" y="494.5" text-anchor="middle" class="node">线上分类</text>
  <text x="480.0" y="510.5" text-anchor="middle" class="node">待验证，可用后补齐</text>
  <text x="340" y="572" class="sub">书城页：搜索微信读书 + 公众号；无结果统一「换个关键词试试」。</text>
  <rect x="640" y="268" width="280" height="60" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="780.0" y="302.5" text-anchor="middle" class="node">账号状态</text>
  <rect x="640" y="348" width="280" height="96" rx="8" ry="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="780.0" y="384.5" text-anchor="middle" class="node">今日阅读 / 本周阅读</text>
  <text x="780.0" y="400.5" text-anchor="middle" class="node">点卡片=刷新时长</text>
  <text x="780.0" y="416.5" text-anchor="middle" class="node">阅读周报入口在列表</text>
  <rect x="640" y="464" width="280" height="72" rx="8" ry="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="780.0" y="496.5" text-anchor="middle" class="node">我的批注 · 全部书籍</text>
  <text x="780.0" y="512.5" text-anchor="middle" class="node">阅读历史 · 设置</text>
  <text x="640" y="572" class="sub">我的页：时长卡（KOReader 统计）点击刷新；周报/批注/书架管理/历史/设置。</text>
  <line x1="408" y1="116" x2="408" y2="170" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <g transform="translate(40,640)">
    <line x1="0" y1="8" x2="26" y2="8" stroke="#2563eb" stroke-width="1.5"/>
    <text x="32" y="12" class="zone">点按 / 普通流程</text>
    <line x1="0" y1="30" x2="26" y2="30" stroke="#ea580c" stroke-width="1.5"/>
    <text x="32" y="34" class="zone">长按 / 诊断</text>
  </g>
  <text x="40" y="620" class="sub">同步入口：点按 = 后台静默同步全部；长按 = 同步诊断。休眠前会先同步再息屏。</text>
</svg>
