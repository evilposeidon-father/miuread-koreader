name: CI checks

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  lua-syntax-and-python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Run Lua 5.1 syntax checks
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y lua5.1
          find miuread.koplugin -type f -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p

      - name: Run Python structural regression tests
        shell: bash
        run: |
          python3 -m unittest discover -s tests -v
