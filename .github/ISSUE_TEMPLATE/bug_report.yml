name: Bug 报告
description: 提交一个 bug 报告
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: 插件版本
      placeholder: 例如 4.5.35
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 设备与 KOReader 版本
      placeholder: 例如 Kindle / KOReader 2026.03
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 复现步骤
      description: 清晰描述触发 bug 的步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为与实际行为
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 诊断信息
      description: 如可能，附上 crash.log 或「生成诊断包」产物
